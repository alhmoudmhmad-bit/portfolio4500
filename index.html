<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم الحمود - المنيو الفاخر</title>
    <!-- خط عربي أنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #f5f5f5;
            padding-bottom: 90px;
        }

        /* --- واجهة البداية المتحركة (أسود وذهبي) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a, #1f1a10);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #fff;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #splash-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .splash-logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: #d4af37;
            margin-bottom: 15px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            animation: bounceIn 1.2s infinite alternate;
        }

        .splash-desc {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #cccccc;
        }

        .social-links {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .social-links a {
            width: 50px;
            height: 50px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4af37;
            font-size: 1.5rem;
            transition: 0.3s;
            text-decoration: none;
        }

        .social-links a:hover { 
            background: #d4af37; 
            color: #000;
            transform: scale(1.1); 
        }

        .btn-view-menu {
            background: linear-gradient(135deg, #d4af37, #aa820a);
            color: #000;
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
            transition: 0.3s;
        }

        .btn-view-menu:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }

        /* --- الهيدر الفاخر --- */
        header {
            background: #141414;
            border-bottom: 2px solid #d4af37;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 2rem;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            margin: 0 auto;
        }

        .back-to-splash-btn {
            background: #222;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.3s;
        }
        .back-to-splash-btn:hover {
            background: #d4af37;
            color: #000;
        }

        .categories-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .cat-btn {
            background: #222;
            color: #ccc;
            border: 1px solid #444;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        .cat-btn.active, .cat-btn:hover {
            background: #d4af37;
            color: #000;
            border-color: #d4af37;
        }

        .admin-trigger-btn {
            background: transparent;
            color: #d4af37;
            border: 1px dashed #d4af37;
            padding: 6px 16px;
            border-radius: 15px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
            font-weight: 700;
        }
        .admin-trigger-btn:hover {
            background: #d4af37;
            color: #000;
        }

        /* --- حاوية المنيو --- */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .menu-item {
            background: #171717;
            border: 1px solid #282828;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-item:hover {
            transform: translateY(-5px);
            border-color: #d4af37;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.15);
        }

        .menu-item img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .menu-item-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .menu-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .menu-item-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .menu-item-price {
            font-weight: 900;
            color: #d4af37;
            font-size: 1.1rem;
        }

        .menu-item-desc {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 15px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 5px;
        }

        .qty-btn {
            background: #d4af37;
            color: #000;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:hover { background: #f39c12; }

        .qty-display {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
        }

        /* --- الشريط السفلي العائم للسلة --- */
        #cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #141414;
            border-top: 2px solid #d4af37;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
            z-index: 500;
            transform: translateY(100%);
            transition: transform 0.3s ease-in-out;
        }

        #cart-bar.active {
            transform: translateY(0);
        }

        .cart-info {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }

        .cart-info span {
            color: #d4af37;
        }

        .cart-actions {
            display: flex;
            gap: 12px;
        }

        .view-cart-btn {
            background: #222;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .view-cart-btn:hover {
            background: #d4af37;
            color: #000;
        }

        .whatsapp-btn {
            background: #25d366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            text-decoration: none;
        }
        .whatsapp-btn:hover {
            background: #20ba5a;
        }

        /* --- النوافذ المنبثقة (Modals) --- */
        #cart-modal, #admin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: #1a1a1a;
            border: 1px solid #d4af37;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
            color: #fff;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .modal-box h2 {
            margin-bottom: 20px;
            color: #d4af37;
            font-size: 1.3rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .cart-items-list, .admin-items-list {
            overflow-y: auto;
            max-height: 50vh;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #111;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #282828;
            gap: 10px;
        }

        /* تنسيق كارت التعديل الشامل داخل لوحة الإدارة */
        .admin-edit-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-edit-row {
            display: flex;
            gap: 10px;
        }

        .admin-edit-row input, .admin-edit-row select, .admin-edit-row textarea {
            flex: 1;
            padding: 8px;
            background: #1c1c1c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .admin-actions-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .save-item-btn {
            background: #27ae60;
            color: #fff;
            border: none;
            padding: 6px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .save-item-btn:hover { background: #219653; }

        .delete-item-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .delete-item-btn:hover { background: #c0392b; }

        /* نموذج الإدخال */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #ccc;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #d4af37;
            outline: none;
        }

        .image-preview-container {
            margin-top: 5px;
            width: 100%;
            height: 80px;
            border: 1px dashed #444;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #111;
        }
        .image-preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-submit {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover { background: #f39c12; }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #888;
        }
        .close-modal:hover { color: #fff; }

        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .admin-tab-btn {
            flex: 1;
            background: #222;
            color: #ccc;
            border: 1px solid #444;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .admin-tab-btn.active {
            background: #d4af37;
            color: #000;
            border-color: #d4af37;
        }

        @keyframes bounceIn {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- 1. واجهة الترحيب المتحركة -->
    <div id="splash-screen">
        <div class="splash-logo"><i class="fa-solid fa-utensils"></i> M&S</div>
        <div class="splash-desc">أهلاً بك في عالم الفخامة والمذاق الراقي. تلذذ بأطيب الأصناف.</div>
        
        <div class="social-links">
            <a href="https://instagram.com" target="_blank" class="instagram" title="إنستغرام"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://facebook.com" target="_blank" class="facebook" title="فيسبوك"><i class="fa-brands fa-facebook-f"></i></a>
        </div>

        <button class="btn-view-menu" onclick="enterMenu()">فيو منيو (عرض القائمة)</button>
    </div>

    <!-- 2. الهيدر الرئيسي -->
    <header>
        <div class="header-top">
            <button class="back-to-splash-btn" onclick="goToSplash()">
                <i class="fa-solid fa-arrow-right"></i> رجوع للرئيسية
            </button>
           <h1>M&S</h1>
            <div style="width: 90px;"></div>
        </div>

        <div class="categories-nav">
            <button class="cat-btn active" onclick="filterMenu('all', this)">الكل</button>
            <button class="cat-btn" onclick="filterMenu('وجبات', this)">وجبات</button>
            <button class="cat-btn" onclick="filterMenu('سندويش', this)">سندويش</button>
            <button class="cat-btn" onclick="filterMenu('سلطات', this)">سلطات</button>
            <button class="cat-btn" onclick="filterMenu('عصير', this)">عصير</button>
            <!-- <button class="cat-btn" onclick="filterMenu('سمير', this)">سمير</button> -->
            
        
        </div>
        <button class="admin-trigger-btn" onclick="checkAdminPassword()">إدارة القائمة</button>
    </header>

    <!-- 3. عرض أصناف المنيو -->
    <div class="container">
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- 4. الشريط السفلي العائم للسلة -->
    <div id="cart-bar">
        <div class="cart-info">
            المنتجات: <span id="cartCount">0</span> | الإجمالي: <span id="cartTotal">0</span> ل.س
        </div>
        <div class="cart-actions">
            <button class="view-cart-btn" onclick="openCartModal()">
                <i class="fa-solid fa-basket-shopping"></i> عرض السلة
            </button>
            <button class="whatsapp-btn" onclick="sendToWhatsApp()">
                <i class="fa-brands fa-whatsapp fa-lg"></i> إرسال للواتساب
            </button>
        </div>
    </div>

    <!-- 5. نافذة تفاصيل السلة -->
    <div id="cart-modal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeCartModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2><i class="fa-solid fa-cart-shopping"></i> محتويات السلة</h2>
            
            <div class="cart-items-list" id="cartItemsList"></div>

            <div style="border-top:1px solid #333; padding-top:12px; display:flex; justify-content:space-between; font-size:1.1rem; font-weight:700; margin-bottom:15px;">
                المجموع الكلي: <span id="modalCartTotal" style="color:#d4af37;">0 ل.س</span>
            </div>

            <button class="whatsapp-btn" style="width: 100%; justify-content: center; padding: 12px; font-size: 1.1rem;" onclick="sendToWhatsApp()">
                <i class="fa-brands fa-whatsapp fa-xl"></i> إتمام الطلب عبر واتساب
            </button>
        </div>
    </div>

    <!-- 6. لوحة إدارة القائمة (تعديل كامل المنتجات + إضافة صنف جديد) -->
    <div id="admin-modal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeAdminModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2>لوحة إدارة القائمة</h2>
            
            <div class="admin-tabs">
                <button class="admin-tab-btn active" id="tabEditAllBtn" onclick="switchAdminTab('editAll')">تعديل المنتجات الحالية</button>
                <button class="admin-tab-btn" id="tabAddBtn" onclick="switchAdminTab('add')">إضافة منتج جديد</button>
            </div>

            <!-- قسم تعديل كامل المنتجات -->
            <div id="adminEditAllSection">
                <p style="font-size:0.85rem; color:#aaa; margin-bottom:12px;">يمكنك تعديل أي تفصيل (الاسم، السعر، القسم، الصورة، الوصف) لأي منتج:</p>
                <div class="admin-items-list" id="adminEditList"></div>
            </div>

            <!-- قسم إضافة منتج جديد (ينزل مباشرة بداخل نظام التعديل والقائمة) -->
            <form id="addForm" style="display: none;" onsubmit="addNewItem(event)">
                <div class="form-group">
                    <label>اسم الصنف</label>
                    <input type="text" id="itemName" required placeholder="مثال: برغر لحم فاخر">
                </div>
                <div class="form-group">
                    <label>القسم</label>
                    <select id="itemCategory" required>
                        <option value="وجبات">وجبات</option>
                        <option value="سندويش">سندويش</option>
                        <option value="سلطات">سلطات</option>
                        <option value="عصير">عصير</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>السعر (أرقام فقط)</label>
                    <input type="number" id="itemPrice" required placeholder="مثال: 25000">
                </div>
                <div class="form-group">
                    <label>رابط الصورة (URL)</label>
                    <input type="url" id="itemImage" required placeholder="ضع رابط صورة صالحة" oninput="previewImage(this.value, 'imgPreview', 'previewPlaceholder')">
                    <div class="image-preview-container">
                        <span id="previewPlaceholder" style="color:#666; font-size:0.85rem;">معاينة الصورة</span>
                        <img id="imgPreview" alt="معاينة" style="display:none;">
                    </div>
                </div>
                <div class="form-group">
                    <label>وصف مختصر</label>
                    <textarea id="itemDesc" rows="2" placeholder="مكونات الصنف..."></textarea>
                </div>
                <button type="submit" class="btn-submit">حفظ وإضافة للقائمة</button>
            </form>
        </div>
    </div>

    <!-- 7. الجافاسكريبت -->
    <script>
        let defaultItems = [
            { id: 1, name: "وجبة برغر مشوي ديلوكس", category: "وجبات", price: 45000, image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop", desc: "لحم بقري طازج مع الجبن الفاخر والبطاطا." },
            { id: 2, name: "وجبة شاورما عربي صاج", category: "وجبات", price: 38000, image: "https://images.unsplash.com/photo-1529007196863-d0dce800956b?w=500&auto=format&fit=crop", desc: "قطع دجاج متبلة مع الثوم والمخلل الفاخر." },
            { id: 3, name: "وجبة شيش طاووق ملكي", category: "وجبات", price: 42000, image: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=500&auto=format&fit=crop", desc: "أسياخ دجاج مشوية عالفحم مع الأرز البسمتي." },
            { id: 4, name: "سندويش زنزبر دجاج حار", category: "سندويش", price: 22000, image: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=500&auto=format&fit=crop", desc: "دجاج مقرمش مع الصوص الخاص والخس." },
            { id: 5, name: "سندويش فاهيتا لحم", category: "سندويش", price: 26000, image: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=500&auto=format&fit=crop", desc: "شرائح لحم مع الفليفلة والبصل والجبن المذاب." },
            { id: 6, name: "سندويش كريسبي دجاج", category: "سندويش", price: 23000, image: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=500&auto=format&fit=crop", desc: "أصابع دجاج مقرمشة طازجة مع المايونيز." },
            { id: 7, name: "سلطة سيزر بالدجاج", category: "سلطات", price: 18000, image: "https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=500&auto=format&fit=crop", desc: "خس طازج، دجاج مشوي، جبن بارميزان وصوص سيزر." },
            { id: 8, name: "سلطة يونانية تقليدية", category: "سلطات", price: 15000, image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=500&auto=format&fit=crop", desc: "خضار طازجة مع جبنة الفيتا والزيتون الأسود." },
            { id: 9, name: "عصير برتقال طبيعي 100%", category: "عصير", price: 12000, image: "https://images.unsplash.com/photo-1613478223719-2ab802602423?w=500&auto=format&fit=crop", desc: "عصير برتقال طازج ومعصور على البارد." },
            { id: 10, name: "عصير كوكتيل طبقات فواكه", category: "عصير", price: 16000, image: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=500&auto=format&fit=crop", desc: "تشكيلة فواكه طازجة غنية بالقشطة والمكسرات." }
 ,
           { id: 11, name: "عصير كوكتيل ", category: "عصير", price: 16000, image: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=500&auto=format&fit=crop", desc: "تشكيلة فواكه طازجة غنية بالقشطة والمكسرات." }
 
       
];
       
        

        let menuItems = JSON.parse(localStorage.getItem('hamood_menu_gold_v6')) || defaultItems;
        let cart = {}; 
        let currentFilter = 'all';''

        function enterMenu() {
            document.getElementById('splash-screen').classList.add('hidden');
        }

        function goToSplash() {
            document.getElementById('splash-screen').classList.remove('hidden');
        }

        function renderMenu(itemsToRender) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';

            if (itemsToRender.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color:#888; padding: 40px;">لا توجد أصناف متاحة حالياً في هذا القسم.</p>`;
                return;
            }

            itemsToRender.forEach(item => {
                let qty = cart[item.id] || 0;
                grid.innerHTML += `
                    <div class="menu-item">
                        <img src="${item.image}" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'">
                        <div class="menu-item-content">
                            <div>
                                <div class="menu-item-header">
                                    <span class="menu-item-title">${item.name}</span>
                                    <span class="menu-item-price">${item.price.toLocaleString()} ل.س</span>
                                </div>
                                <p class="menu-item-desc">${item.desc || ''}</p>
                            </div>
                            <div class="qty-control">
                                <button class="qty-btn" onclick="changeQty(${item.id}, 1)"><i class="fa-solid fa-plus"></i></button>
                                <span class="qty-display" id="qty-${item.id}">${qty}</span>
                                <button class="qty-btn" onclick="changeQty(${item.id}, -1)"><i class="fa-solid fa-minus"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filterMenu(category, btnElement) {
            currentFilter = category;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'all') {
                renderMenu(menuItems);
            } else {
                const filtered = menuItems.filter(item => item.category === category);
                renderMenu(filtered);
            }
        }

        function changeQty(id, change) {
            if (!cart[id]) cart[id] = 0;
            cart[id] += change;

            if (cart[id] <= 0) {
                delete cart[id];
            }

            let qtySpan = document.getElementById(`qty-${id}`);
            if (qtySpan) {
                qtySpan.textContent = cart[id] || 0;
            }

            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cart-bar');
            const cartCount = document.getElementById('cartCount');
            const cartTotal = document.getElementById('cartTotal');

            let totalCount = 0;
            let totalPrice = 0;

            for (let id in cart) {
                let item = menuItems.find(i => i.id == id);
                if (item) {
                    totalCount += cart[id];
                    totalPrice += item.price * cart[id];
                }
            }

            if (totalCount > 0) {
                cartBar.classList.add('active');
                cartCount.textContent = totalCount;
                cartTotal.textContent = totalPrice.toLocaleString();
            } else {
                cartBar.classList.remove('active');
            }
        }

        function openCartModal() {
            const listContainer = document.getElementById('cartItemsList');
            const modalTotal = document.getElementById('modalCartTotal');
            listContainer.innerHTML = '';

            let totalPrice = 0;
            let isEmpty = true;

            for (let id in cart) {
                let item = menuItems.find(i => i.id == id);
                if (item && cart[id] > 0) {
                    isEmpty = false;
                    let itemTotal = item.price * cart[id];
                    totalPrice += itemTotal;

                    listContainer.innerHTML += `
                        <div class="cart-item-row">
                            <div class="cart-item-details">
                                <strong>${item.name}</strong><br>
                                <font style="font-size:0.85rem; color:#aaa;">${cart[id]} × ${item.price.toLocaleString()} = ${itemTotal.toLocaleString()} ل.س</font>
                            </div>
                            <div style="display: flex; gap: 5px; align-items: center;">
                                <button class="qty-btn" style="width:26px; height:26px; font-size:0.8rem;" onclick="changeQty(${id}, 1)">+</button>
                                <span style="font-weight:bold; width:20px; text-align:center;">${cart[id]}</span>
                                                          ]                              <button class="qty-btn" style="width:26px; height:26px; font-size:0.8rem;" onclick="changeQty(${id}, -1)">-</button>
                            </div>
                        </div>
                    `;
                }
            }

            if (isEmpty) {
                listContainer.innerHTML = `<p style="text-align:center; color:#888; padding: 20px;">السلة فارغة حالياً.</p>`;
                modalTotal.textContent = "0 ل.س";
            } else {
                modalTotal.textContent = totalPrice.toLocaleString() + " ل.س";
            }

            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCartModal() {
            document.getElementById('cart-modal').style.display = 'none';
            refreshActiveMenu();
        }

        function sendToWhatsApp() {
            let totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
            if (totalCount === 0) {
                alert("الرجاء إضافة أصناف للسلة أولاً!");
                return;
            }

            const phoneNumber = "963981448957"; // استبدل برقم هاتفك الحقيقي

            let message = "مرحباً، أرغب بطلب الاصناف التالية من مطعم الحمود:\n\n";
            let totalPrice = 0;
            let index = 1;

            for (let id in cart) {
                let item = menuItems.find(i => i.id == id);
                if (item && cart[id] > 0) {
                    let itemTotal = item.price * cart[id];
                    message += `${index}. ${item.name} (الكمية: ${cart[id]}) - ${itemTotal.toLocaleString()} ل.س\n`;
                    totalPrice += itemTotal;
                    index++;
                }
            }

            message += `\nالإجمالي الكلي: ${totalPrice.toLocaleString()} ل.س\n\nشكراً لكم!`;

            let encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${phoneNumber}?text=${encodedMessage}`, '_blank');
        }

        // --- نظام لوحة الإدارة بكلمة السر ---
        function checkAdminPassword() {
            let pass = prompt("الرجاء إدخال كلمة سر لوحة الإدارة ():");
            if (pass === "1234") {
                openAdminModal();
            } else if (pass !== null) {
                alert("كلمة السر غير صحيحة!");
            }
        }

        function openAdminModal() {
            renderAdminEditList();
            switchAdminTab('editAll');
            document.getElementById('admin-modal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').style.display = 'none';
            refreshActiveMenu();
            updateCartBar();
        }

        function switchAdminTab(tab) {
            const editSec = document.getElementById('adminEditAllSection');
            const addForm = document.getElementById('addForm');
            const tabEditAllBtn = document.getElementById('tabEditAllBtn');
            const tabAddBtn = document.getElementById('tabAddBtn');

            if (tab === 'editAll') {
                editSec.style.display = 'block';
                addForm.style.display = 'none';
                tabEditAllBtn.classList.add('active');
                tabAddBtn.classList.remove('active');
                renderAdminEditList();
            } else {
                editSec.style.display = 'none';
                addForm.style.display = 'block';
                tabAddBtn.classList.add('active');
                tabEditAllBtn.classList.remove('active');
            }
        }

        // عرض قائمة التعديل الشامل لكل المنتجات
        function renderAdminEditList() {
            const list = document.getElementById('adminEditList');
            list.innerHTML = '';

            if (menuItems.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#888; padding:20px;">لا توجد منتجات حالياً.</p>`;
                return;
            }

            menuItems.forEach(item => {
                list.innerHTML += `
                    <div class="admin-edit-card" id="card-${item.id}">
                        <div class="admin-edit-row">
                            <input type="text" id="name-${item.id}" value="${item.name}" placeholder="اسم الصنف">
                            <select id="cat-${item.id}">
                                <option value="وجبات" ${item.category === 'وجبات' ? 'selected' : ''}>وجبات</option>
                                <option value="سندويش" ${item.category === 'سندويش' ? 'selected' : ''}>سندويش</option>
                                <option value="سلطات" ${item.category === 'سلطات' ? 'selected' : ''}>سلطات</option>
                                <option value="عصير" ${item.category === 'عصير' ? 'selected' : ''}>عصير</option>
                            </select>
                            <input type="number" id="price-${item.id}" value="${item.price}" placeholder="السعر">
                        </div>
                        <div class="admin-edit-row">
                            <input type="url" id="img-${item.id}" value="${item.image}" placeholder="رابط الصورة">
                        </div>
                        <div class="admin-edit-row">
                            <textarea id="desc-${item.id}" rows="1" placeholder="الوصف">${item.desc || ''}</textarea>
                        </div>
                        <div class="admin-actions-row">
                            <button class="save-item-btn" onclick="saveAdminItem(${item.id})"><i class="fa-solid fa-check"></i> حفظ التعديل</button>
                            <button class="delete-item-btn" onclick="deleteAdminItem(${item.id})"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        // حفظ التعديل لمنتج معين من لوحة الشامل
        function saveAdminItem(id) {
            let item = menuItems.find(i => i.id == id);
            if (item) {
                item.name = document.getElementById(`name-${id}`).value;
                item.category = document.getElementById(`cat-${id}`).value;
                item.price = Number(document.getElementById(`price-${id}`).value);
                item.image = document.getElementById(`img-${id}`).value;
                item.desc = document.getElementById(`desc-${id}`).value;

                localStorage.setItem('hamood_menu_gold_v6', JSON.stringify(menuItems));
                alert(`تم حفظ تعديلات "${item.name}" بنجاح!`);
                refreshActiveMenu();
            }
        }

        // حذف منتج من لوحة الشامل
        function deleteAdminItem(id) {
            if (confirm("هل أنت متأكد من حذف هذا الصنف نهائياً؟")) {
                menuItems = menuItems.filter(i => i.id !== id);
                delete cart[id];
                localStorage.setItem('hamood_menu_gold_v6', JSON.stringify(menuItems));
                renderAdminEditList();
                refreshActiveMenu();
            }
        }

        function previewImage(url, imgId, placeholderId) {
            const img = document.getElementById(imgId);
            const placeholder = document.getElementById(placeholderId);
            if (url && url.startsWith('http')) {
                img.src = url;
                img.style.display = 'block';
                placeholder.style.display = 'none';
            } else {
                img.style.display = 'none';
                placeholder.style.display = 'block';
            }
        }

        // إضافة منتج جديد وينزل تلقائياً داخل نظام التعديل والقائمة
        function addNewItem(e) {
            e.preventDefault();
            
            const newItem = {
                id: Date.now(),
                name: document.getElementById('itemName').value,
                category: document.getElementById('itemCategory').value,
                price: Number(document.getElementById('itemPrice').value),
                image: document.getElementById('itemImage').value,
                desc: document.getElementById('itemDesc').value
            };

            menuItems.push(newItem);
            localStorage.setItem('hamood_menu_gold_v6', JSON.stringify(menuItems));
            
            document.getElementById('addForm').reset();
            document.getElementById('imgPreview').style.display = 'none';
            document.getElementById('previewPlaceholder').style.display = 'block';

            alert("تم إضافة المنتج الجديد بنجاح وأصبح متاحاً في قائمة التعديل والمنيو!");
            switchAdminTab('editAll'); // يرجعك فوراً لصفحة التعديل الشامل لتراه أمامك
        }

        function refreshActiveMenu() {
            if (currentFilter === 'all') {
                renderMenu(menuItems);
            } else {
                renderMenu(menuItems.filter(i => i.category === currentFilter));
            }
        }

        window.onload = function() {
            renderMenu(menuItems);
        };
    </script>
</body>
